  <title>Sales Data: Pat's Salmon Cookies</title>

<body>
  <header>


  <h1>Pat's Salmon Cookies Sales</h1>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="sales.html">Sales Data</a></li>
    </ul>
  </nav>
   </header>
   <main>

    <section class="form-section">
      <fieldset>
        <legend>Add a new store!!!</legend>

        <form id="store-form">
          <label>Location Name <input name="name" /></label>
          <label>Minimum Customers Per Hour <input name="min" type="number" /></label>
          <label>Maximum Customers Per Hour <input name="max" type="number" /></label>
          <label>Average Cookies Per Sale <input name="avg" type="number" step="0.1" /></label>
          <button type="submit">Click here to add!</button>
        
        </form>
      </fieldset>
    </section>

    <section class="table-section">
      <table id="sales-table"></table>
    </section>


   </main>
